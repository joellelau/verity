<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verity</title>
<meta name="description" content="Save links, reply with quotes and notes, and reflect on what you read.">
<meta name="theme-color" content="#fafafa" id="themeColor">
<script>
  // Apply the saved theme before the page paints, to avoid a flash.
  try { var t = localStorage.getItem('verity:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cg fill='none' stroke='%23fafafa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' transform='translate(4 4)'%3E%3Cpath d='M4 19V5a1 1 0 011-1h3v16H5a1 1 0 01-1-1z'/%3E%3Cpath d='M8 4h4v16H8'/%3E%3Cpath d='M14.5 5.2l3.9-1 3.4 14.6-3.9 1z'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
<div class="gate" id="gate" hidden></div>
<div class="app" hidden>
  <aside class="sidenav" id="sidenav" aria-label="Main"></aside>

  <main class="main" id="main">
    <header class="page-header" id="pageHeader" hidden></header>
    <div class="view" id="view"></div>

    <div class="composer" id="composer">
      <div id="composerContext"></div>
      <label for="draft" class="sr-only">Message</label>
      <textarea id="draft" rows="1" autocomplete="off"></textarea>
      <div class="composer-bar">
        <button type="button" id="fullBtn" class="ghost-btn" title="Write in a full page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
          Full page
        </button>
        <button type="button" id="quoteBtn" class="ghost-btn outlined" hidden aria-label="Mark selected text as quote">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h4v4c0 3-2 5-4 6"/><path d="M15 7h4v4c0 3-2 5-4 6"/></svg>
          Quote
        </button>
        <span class="spacer"></span>
        <button type="button" id="sendBtn" class="send is-empty" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </main>

  <button type="button" class="fab-menu" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <nav class="drawer" id="drawer" aria-label="Main" inert></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
